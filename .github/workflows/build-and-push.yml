name: Build and Push Docker Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '!.github/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '-noci')

    permissions:
      contents: read
      packages: write

    steps:
      # Наш репозиторий: patch.js, patch.sh, nginx.conf, Dockerfile
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Исходники telegram-tt
      - name: Checkout telegram-tt
        uses: actions/checkout@v7
        with:
          repository: Ajaxy/telegram-tt
          ref: master
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Кешируем именно готовый node_modules.
      # При cache-hit npm ci вообще не запускается.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: upstream/node_modules
          key: >
            telegram-tt-node24-${{
              hashFiles(
                'upstream/package.json',
                'upstream/package-lock.json'
              )
            }}-floating-ui-v1

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: upstream
        run: |
          npm ci --no-audit --no-fund
          npm install @floating-ui/dom --no-save --no-audit --no-fund

      - name: Apply patches
        run: |
          cp patch.js patch.sh /tmp/
          chmod +x /tmp/patch.sh
          /tmp/patch.sh "$GITHUB_WORKSPACE/upstream"

      - name: Build frontend
        working-directory: upstream
        env:
          APP_ENV: production
        run: npm run build:production

      # Оставляем Docker context практически пустым.
      - name: Prepare Docker context
        run: |
          rm -rf docker-dist
          mv upstream/dist docker-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}