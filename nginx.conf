map $arg_backend $tg_backend {
    # Z-Client
    zws1   https://zws1.web.telegram.org;
    zws2   https://zws2.web.telegram.org;
    zws3   https://zws3.web.telegram.org;
    zws4   https://zws4.web.telegram.org;
    zws5   https://zws5.web.telegram.org;
    zws1-1 https://zws1-1.web.telegram.org;
    zws2-1 https://zws2-1.web.telegram.org;
    zws3-1 https://zws3-1.web.telegram.org;
    zws4-1 https://zws4-1.web.telegram.org;
    zws5-1 https://zws5-1.web.telegram.org;

    # K-Client
    kws1   https://kws1.web.telegram.org;
    kws2   https://kws2.web.telegram.org;
    kws3   https://kws3.web.telegram.org;
    kws4   https://kws4.web.telegram.org;
    kws5   https://kws5.web.telegram.org;
    kws1-1 https://kws1-1.web.telegram.org;
    kws2-1 https://kws2-1.web.telegram.org;
    kws3-1 https://kws3-1.web.telegram.org;
    kws4-1 https://kws4-1.web.telegram.org;
    venus  https://venus.web.telegram.org;

    default https://zws2.web.telegram.org;
}

map $arg_backend $tg_host {
    zws1   zws1.web.telegram.org;
    zws2   zws2.web.telegram.org;
    zws3   zws3.web.telegram.org;
    zws4   zws4.web.telegram.org;
    zws5   zws5.web.telegram.org;
    zws1-1 zws1-1.web.telegram.org;
    zws2-1 zws2-1.web.telegram.org;
    zws3-1 zws3-1.web.telegram.org;
    zws4-1 zws4-1.web.telegram.org;
    zws5-1 zws5-1.web.telegram.org;

    kws1   kws1.web.telegram.org;
    kws2   kws2.web.telegram.org;
    kws3   kws3.web.telegram.org;
    kws4   kws4.web.telegram.org;
    kws5   kws5.web.telegram.org;
    kws1-1 kws1-1.web.telegram.org;
    kws2-1 kws2-1.web.telegram.org;
    kws3-1 kws3-1.web.telegram.org;
    kws4-1 kws4-1.web.telegram.org;
    venus  venus.web.telegram.org;

    default zws2.web.telegram.org;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location ~ ^/wss(?<tg_path>/.*)$ {
        proxy_pass $tg_backend$tg_path;

        proxy_ssl_server_name on;
        proxy_ssl_name $tg_host;
        proxy_set_header Host $tg_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:wasm|tgs)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            application/wasm wasm;
            application/octet-stream tgs;
        }
    }

    location ~* (?:serviceWorker.*\.js|site.*\.webmanifest|index\.html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
